<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hybrid Coach">
  <!-- Strava/Garmin App-Icon -->
  <title>Hybrid Coach – Performance</title>
  <style>
    :root {
      --bg: #0d0e11;
      --card: #17191f;
      --card-inner: #20232b;
      --text: #ffffff;
      --muted: #9ca3af;
      --strava: #fc4c02;
      --strava-glow: rgba(252, 76, 2, 0.18);
      --garmin-blue: #00a8e8;
      --green: #10b981;
      --border: #2a2e39;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 18px 16px 48px; background: var(--bg); color: var(--text); line-height: 1.4; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; margin: 0; text-transform: uppercase; }
    h1 span { color: var(--strava); }
    .subtitle { color: var(--muted); font-size: 0.8rem; margin-top: 2px; font-weight: 500; }
    
    h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.35); }
    
    /* Countdown Kacheln */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat-box { background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--strava); padding: 12px 10px; border-radius: 14px; text-align: center; }
    .stat-box.garmin { border-top-color: var(--garmin-blue); }
    .stat-val { font-size: 1.75rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1.1; }
    .stat-lbl { font-size: 0.72rem; color: var(--muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; }

    /* Progress Bar */
    .progress-wrap { margin-bottom: 14px; }
    .progress-header { display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
    .progress-bar { width: 100%; height: 8px; background: var(--card-inner); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--strava), #ff7b39); border-radius: 99px; transition: width 0.35s ease; }

    /* Tasks */
    .task { display: flex; align-items: flex-start; gap: 12px; padding: 12px; margin-bottom: 8px; background: var(--card-inner); border-radius: 12px; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; }
    .task:last-child { margin-bottom: 0; }
    .task.done { opacity: 0.55; border-color: rgba(16, 185, 129, 0.3); }
    .task.done span { text-decoration: line-through; color: var(--muted); }
    .task input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border: 2px solid var(--strava); border-radius: 6px; margin-top: 1px; flex-shrink: 0; display: grid; place-content: center; background: transparent; }
    .task input[type="checkbox"]:checked { background: var(--green); border-color: var(--green); }
    .task input[type="checkbox"]:checked::before { content: "✓"; color: #052e16; font-weight: 900; font-size: 14px; }
    .task span { font-size: 0.9rem; font-weight: 500; }

    /* Garmin Zonen mit Farbbalken */
    .zone-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.83rem; padding: 8px 10px; background: var(--card-inner); border-radius: 8px; margin-bottom: 6px; border-left: 4px solid var(--garmin-blue); }
    .zone-row:last-child { margin-bottom: 0; }
    .zone-row.z-mp { border-left-color: var(--green); }
    .zone-row.z-th { border-left-color: #f59e0b; }
    .zone-row.z-vo2 { border-left-color: var(--strava); }
    .zone-row strong { font-variant-numeric: tabular-nums; color: var(--text); }

    textarea
